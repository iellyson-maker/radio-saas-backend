databases:
  - name: radio-saas-db
    plan: starter
    region: oregon

services:
  - type: web
    name: radio-saas-backend
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: radio-saas-db
          property: connectionString
